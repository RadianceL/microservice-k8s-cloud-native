# 规则配置
rules:
  - !SHARDING
    shardingAlgorithms:
      database_standard_sharding_algorithm:
        type: CLASS_BASED
        props:
          strategy: standard
          algorithmClassName: com.olympus.algorithm.StandardDatabaseShardingAlgorithm
    tables:
      sys_user:
        databaseStrategy:
          standard:
            shardingColumn: cid
            shardingAlgorithmName: database_standard_sharding_algorithm